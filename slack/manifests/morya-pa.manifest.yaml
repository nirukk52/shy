_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Morya PA
  description: Menswear growth and operations copilot (Pune)
  background_color: "#0f766e"

features:
  bot_user:
    display_name: Morya PA
    always_online: false
  slash_commands:
    - command: /morya
      description: Send a growth/ops task to Morya PA
      usage_hint: /morya <task>
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - channels:join
      - reactions:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
